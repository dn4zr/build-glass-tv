
name: Build Glass TV APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Get official Glass TV Source code
        uses: actions/checkout@v4
        with:
          repository: cocombee/glass-tv
          ref: main

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'


      - name: Install Android SDK packages
        shell: bash
        run: |
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager -path '*/bin/sdkmanager' -print -quit 2>/dev/null)"

          if [ -z "$SDKMANAGER" ]; then
            echo "ERROR: sdkmanager was not found."
            echo "Available Android SDK directories:"
            ls -la "$SDK_ROOT" "$SDK_ROOT/cmdline-tools" || true
            exit 1
          fi

          echo "Using SDK manager: $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses || true
          "$SDKMANAGER" --install "platforms;android-34" "build-tools;34.0.0"


      - name: Build and test Glass TV
        working-directory: launcher
        run: |
          chmod +x gradlew
          ./gradlew testReleaseUnitTest assembleRelease --no-daemon

      - name: Save APK as build artifact
        uses: actions/upload-artifact@v4
        with:
          name: glass-tv-apk
          path: launcher/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 7
